# /etc/nginx/sites-available/foodshare
# Reverse proxy: serves the built React app as static files and proxies
# /api requests to the Node/Express backend running on port 5000 (via PM2).

server {
    listen 80;
    server_name _;

    # React build output (after `npm run build` in /frontend)
    root /var/www/foodshare/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 10M;
}
